<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --border: #2a2a3a;
  --text: #c8c8d8;
  --text-dim: #808098;
  --accent: #6e8cef;
  --green: #5ab87a;
  --orange: #d8a040;
  --purple: #a070c0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.7;
}
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 24px;
  font-size: 12px;
}
.topbar a {
  color: var(--accent);
  text-decoration: none;
}
.topbar a:hover {
  text-decoration: underline;
}
.topbar .filename {
  color: var(--text-dim);
  margin-left: 8px;
}
.container {
  max-width: 820px;
  margin: 0 auto;
  padding: 32px 24px;
}
/* Markdown content styles */
.md h1 {
  font-size: 22px;
  color: var(--accent);
  font-weight: 700;
  margin: 0 0 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.md h2 {
  font-size: 16px;
  color: var(--green);
  font-weight: 600;
  margin: 28px 0 10px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.md h3 {
  font-size: 14px;
  color: var(--orange);
  font-weight: 600;
  margin: 20px 0 8px;
}
.md h4 {
  font-size: 13px;
  color: var(--purple);
  font-weight: 600;
  margin: 16px 0 6px;
}
.md p {
  margin: 0 0 12px;
  color: var(--text);
}
.md a {
  color: var(--accent);
  text-decoration: none;
}
.md a:hover {
  text-decoration: underline;
}
.md strong {
  color: #e0e0f0;
}
.md em {
  color: var(--text-dim);
  font-style: italic;
}
.md ul, .md ol {
  margin: 0 0 12px 20px;
}
.md li {
  margin-bottom: 4px;
}
.md li > ul, .md li > ol {
  margin-top: 4px;
  margin-bottom: 0;
}
.md code {
  background: rgba(110, 140, 239, 0.12);
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 12px;
}
.md pre {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  margin: 0 0 12px;
  overflow-x: auto;
  font-size: 12px;
  line-height: 1.5;
}
.md pre code {
  background: none;
  padding: 0;
  font-size: 12px;
}
.md blockquote {
  border-left: 3px solid var(--accent);
  padding: 4px 12px;
  margin: 0 0 12px;
  color: var(--text-dim);
}
.md table {
  border-collapse: collapse;
  margin: 0 0 12px;
  width: 100%;
  font-size: 12px;
}
.md th {
  background: var(--surface);
  color: var(--accent);
  font-weight: 600;
  text-align: left;
  padding: 6px 10px;
  border: 1px solid var(--border);
}
.md td {
  padding: 6px 10px;
  border: 1px solid var(--border);
}
.md tr:nth-child(even) {
  background: rgba(255,255,255,0.02);
}
.md hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 20px 0;
}
.error {
  color: #c85050;
  text-align: center;
  margin-top: 80px;
  font-size: 14px;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div class="topbar">
  <a href="./">← Back to index</a>
  <span class="filename" id="filename"></span>
</div>
<div class="container">
  <div class="md" id="content"></div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const file = params.get('file');

if (!file || !/^[\w.-]+\.md$/.test(file)) {
  document.getElementById('content').innerHTML = '<div class="error">No valid markdown file specified.</div>';
} else {
  document.getElementById('filename').textContent = file;
  fetch(file)
    .then(r => {
      if (!r.ok) throw new Error('File not found');
      return r.text();
    })
    .then(md => {
      document.getElementById('content').innerHTML = marked.parse(md);
      // Set page title from first h1
      const h1 = document.querySelector('.md h1');
      if (h1) document.title = h1.textContent + ' — AW/KN5000';
    })
    .catch(() => {
      document.getElementById('content').innerHTML = '<div class="error">Could not load ' + file + '</div>';
    });
}
</script>
</body>
</html>
